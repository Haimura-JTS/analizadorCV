[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analizador-cv"
version = "0.1.0"
description = "Aplicacion academica para extraer y estructurar informacion de curriculums PDF."
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24,<2",
    "pydantic>=2,<3",
    "streamlit>=1.60,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
