[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analizador-cv"
version = "0.1.0"
description = "Aplicacion academica para extraer y estructurar informacion de curriculums PDF."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "PyMuPDF>=1.24,<2",
    "pydantic>=2,<3",
    "streamlit>=1.60,<2",
]

[project.urls]
Repository = "https://github.com/Haimura-JTS/analizadorCV"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=7.1,<8",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=cv_analyzer",
    "--cov-report=term-missing",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cv_analyzer"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
where = ["src"]
